[package]
name = "cognata"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cognata"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", default-features = false, features = ["token", "associated_token", "token_2022"] }
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"
solana-sdk-ids = "3.1.0"
